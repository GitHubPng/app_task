name: app_task
description: App Task - Gerenciador de Tarefas by NexCode

publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.0.5
  file_picker: ^8.3.2
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.11.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

flutter_icons:
  android: true
  image_path: "assets/icon/logo.png"